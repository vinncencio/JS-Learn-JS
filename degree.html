<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Степень числа</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="shortcut icon" href="./favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="./favicon/site.webmanifest">
</head>
<body>
    <section class="degree">
        <h3 class="deg-header">степень числа - x<sup>n</sup></h3>
        <form class="input-container numb-input">
            <div class="title numb-title">введите число x: <span class="value" id="numbValue">0</span></div>
            <input id="numbInput" type="text" placeholder="число" onchange="numbFormEvent(this.value)" value="" class="input"/>
            <button class="btn" id="numbBtn" type="submit">задать</button>
        </form>
        <form class="input-container deg-input">
            <div class="title deg-title">введите степень числа n: <span class="value" id="degValue">0</span></div>
            <input id="degInput" type="text" placeholder="степень числа" onchange="degFormEvent(this.value)" value="" class="input" />
            <button class="btn" id="degBtn" type="submit">задать</button>
        </form>
        <div class="result-w">
            <button class="btn" id="calcBtn" onclick="calc();">посчитать</button>
            <span class="result" id="result"></span>
        </div>
    </section>
    <script src="./js/degree.js"></script>
</body>
</html>
